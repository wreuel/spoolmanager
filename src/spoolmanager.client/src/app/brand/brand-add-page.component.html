<section class="brand-add-page">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <header class="brand-add-page__header">
    <div>
      <p class="brand-add-page__eyebrow">Create Brand</p>
      <h1>New Brand</h1>
      <p>Fill in the brand details exactly as they appear on labels to maintain consistent reporting.</p>
    </div>
    <button type="button" class="brand-add-page__back" routerLink="/brands" aria-label="Back to list">
      <span class="brand-add-page__back-icon" aria-hidden="true">
        <svg viewBox="64 64 896 896"><path d="M872 474H286.9l350.2-304c5.6-4.9 2.2-14-5.2-14h-88.5c-3.9 0-7.6 1.4-10.5 3.9L155 487.8a31.96 31.96 0 000 48.3L535.1 866c1.5 1.3 3.3 2 5.2 2h91.5c7.4 0 10.8-9.2 5.2-14L286.9 550H872c4.4 0 8-3.6 8-8v-60c0-4.4-3.6-8-8-8z" /></svg>
      </span>
      Back
    </button>
  </header>

  <app-brand-create class="brand-add-page__form"></app-brand-create>
</section>
